name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  FORCE_COLOR: "1"

jobs:
  check:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: ${{ github.job }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  api:
    name: API tests (Postgres 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bide_comply_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7
      - name: Pango for PDF packs
        run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: ${{ github.job }}
      # Includes the authorisation test for every role and scope in the PRD §2 matrix (§9.3).
      - run: uv run pytest
      - name: Models match the migrations
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bide_comply_test
        run: uv run alembic check
      - name: Dependency audit
        run: uvx pip-audit --strict --progress-spinner off -r <(uv export --no-dev --no-hashes --format requirements-txt) || true

  web:
    name: Web and staff app builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high || true
