[project]
name = "bide-comply-api"
version = "0.1.0"
description = "bide Comply API, Arq workers and compliance engine"
# 3.12 so the local Postgres (pgserver) wheels install; production runs the same version.
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "arq>=0.26",
    "authlib>=1.6",
    "boto3>=1.40",
    "fastapi>=0.120",
    "httpx>=0.28",
    "itsdangerous>=2.2",
    "openpyxl>=3.1",
    "pillow>=11.3",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.10",
    "pydantic[email]>=2.11",
    "pyotp>=2.9",
    "python-dateutil>=2.9",
    "python-multipart>=0.0.20",
    "pywebpush>=2.5.0",
    "redis>=5.2",
    "slack-sdk>=3.36",
    "sqlalchemy>=2.0.43",
    "tzdata>=2025.2",
    "uvicorn[standard]>=0.35",
    "weasyprint>=66",
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",
    "pytest>=8",
    "ruff>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bide_comply"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
# S101: asserts are how pytest checks. S311: random sampling for spot-checks is not cryptographic.
# E501: the formatter owns line length; what it leaves long is a string that reads better whole.
ignore = ["S101", "S311", "B008", "E501", "SIM102", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
# Local Postgres/Redis launcher and the dev reset: fixed commands, development only.
"bide_comply/devinfra.py" = ["S603", "S607", "S608"]
"bide_comply/seed/__main__.py" = ["S603"]
"bide_comply/seed/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
